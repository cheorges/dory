[project]
name = "dory"
version = "0.3.0"
description = "Second brain for Claude Code: sessions become Obsidian notes, recalled at session start"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["plugin"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: runs real claude -p against a throwaway vault (DORY_LIVE=1, costs money)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["dory"]

[tool.ruff.lint.per-file-ignores]
"spike/*" = ["E501"]
